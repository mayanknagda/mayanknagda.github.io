<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111713" media="(prefers-color-scheme: dark)">
  <meta name="description" content="A private, offline-first place for everyday spending.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pocket Spend">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <title>Pocket Spend</title>
</head>
<body>
  <div class="shell">
    <header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">&#9682;</span><span>Pocket Spend</span></div><span class="local-badge">Private on this device</span></header>
    <main id="app" tabindex="-1"><div class="loading">Opening your pocket...</div></main>
    <button id="add-button" class="add-button" type="button" aria-label="Add transaction">+</button>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-page="home" class="active" type="button"><span aria-hidden="true">&#8962;</span>Home</button>
      <button data-page="transactions" type="button"><span aria-hidden="true">&#9783;</span>Transactions</button>
      <button data-page="insights" type="button"><span aria-hidden="true">&#9707;</span>Insights</button>
      <button data-page="settings" type="button"><span aria-hidden="true">&#9881;</span>Settings</button>
    </nav>
  </div>
  <dialog id="editor"><div id="editor-content"></div></dialog>
  <dialog id="detail"><div id="detail-content"></div></dialog>
  <datalist id="merchant-list"></datalist><datalist id="category-list"></datalist><datalist id="item-list"></datalist><datalist id="tag-list"></datalist>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.mjs"></script>
</body>
</html>
