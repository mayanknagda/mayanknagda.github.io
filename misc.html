<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mayank Nagda - notes">
  <meta name="color-scheme" content="light dark">
  <title>Notes</title>
  <script>
    try {
      const theme = localStorage.getItem("theme");
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    } catch (error) {
      // Use the system theme when storage is unavailable.
    }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="page markdown-page">
    <header class="intro markdown-intro">
      <div class="intro__top markdown-intro__top">
        <a class="back-link" href="index.html">← Back</a>
        <button class="theme-toggle" id="theme-toggle" type="button">Theme</button>
      </div>
      <h1 id="markdown-title">Loading…</h1>
      <p class="section-note" id="markdown-meta"></p>
    </header>

    <section class="section markdown-section">
      <div class="markdown-body" id="markdown-content"></div>
    </section>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="markdown.js" defer></script>
</body>

</html>
